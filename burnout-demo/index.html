<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Burnout & Dropout Risk Detection — R26-IT-059</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header class="header">
        <div class="header-inner">
          <div class="header-brand">
            <div class="brand-badge">R26-IT-059</div>
            <div>
              <h1>Academic Burnout & Dropout Risk Detection</h1>
              <p>Explainable Multi-Horizon GRU · OULAD Dataset · IT22916426 Mahavitha S.M.</p>
            </div>
          </div>
          <div class="header-meta">
            <span class="model-pill">Model 8 · Unified Multi-Horizon GRU</span>
            <span class="model-pill accent">F1 = 0.7193 · AUC = 0.8809</span>
          </div>
        </div>
      </header>

      <!-- MAIN LAYOUT -->
  <main class="main">

    <!-- LEFT PANEL: student list -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">Student Predictions</span>
        <div class="filter-row">
          <select id="filterAlert" onchange="filterStudents()">
            <option value="ALL">All levels</option>
            <option value="HIGH">HIGH only</option>
            <option value="MEDIUM">MEDIUM only</option>
            <option value="LOW">LOW only</option>
          </select>
        </div>
      </div>
      <div class="student-list" id="studentList"></div>
    </aside>

    <!-- RIGHT PANEL: student detail -->
    <section class="detail" id="detailPanel">
        <div class="detail-placeholder" id="placeholder">
          <div class="placeholder-icon">⬅</div>
          <p>Select a student from the list to view their risk profile</p>
        </div>
  
        <div class="detail-content hidden" id="detailContent">
  
          <!-- Student header -->
          <div class="detail-header">
            <div>
              <div class="student-id-label" id="dStudentId"></div>
              <div class="risk-headline" id="dRiskHeadline"></div>
            </div>
            <div class="alert-badge-large" id="dAlertBadge"></div>
          </div>


</body>




</html>
